되는 접수 방법 표시","방문·온라인 기한을 따로 적기"],"follow":"나는 방문 접수할 거야. 그 날짜만 크게 보여줘.","check":"방문 9/23과 온라인 9/25를 혼동하지 않아요. 실제 접수는 안 해요.","alt":"페이지 대신 이 세 문서를 입력해 정정 범위만 비교해요.","links":[],"output":"방문·온라인 접수 마감 비교표"},{"id":5,"cat":"탐정처럼 찾기","star":false,"title":"전시 포스터 뒤에 숨은 입장 조건","kind":"모의 자료","first":"무료 전시라는데 그냥 가도 돼? 운영시간, 입장 마감, 예약이 필요한 경우를 나눠줘.","sample":"포스터: 무료\n운영 안내: 화~일 10~17시, 16:30 입장 마감\n해설만 14시 예약 필수\n월요일 휴관.","steps":["무료·운영시간·예약이 각각 무엇에 붙는지 찾기","일반 입장과 해설 구분","방문 카드 만들기"],"follow":"월요일밖에 시간이 없으면 갈 수 있는지 확인해줘.","check":"무료와 예약 불필요를 섞지 않아요. 예약은 안 해요.","alt":"안내 스냅샷으로 운영/입장/해설 시각을 따로 확인해요.","links":[],"output":"휴관·입장 마감·예약 여부가 담긴 방문 카드"},{"id":6,"cat":"탐정처럼 찾기","star":false,"title":"동네 이름으로 옛 지도와 지금 지도 비교","kind":"모의 자료","first":"옛 지도에 나온 시장이 지금 어디쯤인지 비교해줘. 확실한 거랑 추정은 나눠서 보여줘.","sample":"1986 지도: 솔내시장, 큰다리 서쪽\n2026 안내: 솔내문화길, 새다리 서쪽\n옛다리와 새다리의 관계는 미확인.","steps":["지도마다 기준점 표시","공통 단서와 확인 못 한 관계 분리","추가로 볼 자료를 제안"],"follow":"지금 지도에 표시할 수 있는 건 확인된 것만 남겨줘.","check":"확정 위치와 가설을 구분해요. 좌표를 채워 넣지 않아요.","alt":"두 지도 메모만 놓고 확인해야 할 항목을 체크해요.","links":[],"output":"옛 시장의 위치 단서와 추가 확인 목록"}]},{"name":"생활의 골칫거리","items":[{"id":7,"cat":"생활의 골칫거리","star":true,"title":"잃어버린 어르신 교통카드, 첫 연락은?","kind":"실제 원문","first":"서울 사는 가족이 어르신 교통카드를 잃어버렸어. 카드 종류별로 어디에 연락하고 뭘 챙겨야 하는지 알려줘.","sample":"서울에 사는 가족이 어르신 교통카드를 잃어버렸어요.\n카드 유형: 주민센터 단순무임카드 / 은행 신용·체크카드 / 모바일 카드","steps":["서울시 교통카드 안내 열기","카드 유형을 확인하고 창구·준비물 분리","가족용 메모 만들고 재발급 신청 전에 멈추기"],"follow":"주민센터에서 받은 카드래. 휴대폰으로 새로 만들면 실물 카드도 쓸 수 있어?","check":"맞는 카드 유형과 연락처를 원문 대조해요. 실제 신고·인증·신청은 하지 않아요.","alt":"서울시 안내 요점: 유형별 문의처가 다름. 모바일 발급 완료 시 기존 실물 우대카드 정지.","links":[["서울시 교통카드","https://news.seoul.go.kr/traffic/archives/1791"],["서울복지포털 모바일 카드","https://wis.seoul.go.kr/was/stc/seniorTrnsprtCardInfo.do"]],"output":"분실 연락처와 재발급 준비물을 담은 가족용 메모"},{"id":8,"cat":"생활의 골칫거리","star":true,"title":"고객센터 미로에서 담당 창구 찾기","kind":"모의 자료","first":"안 쓴 구독 요금이 나갔어. 영수증에서 누가 결제했는지 보고, 어디에 뭐라고 문의할지 써줘.","sample":"영수증: 11/3 9,900원, 앱스토어 결제\n서비스 FAQ: 웹 결제는 서비스 문의, 앱스토어 결제는 해당 스토어\n사용 여부는 미확인.","steps":["영수증에서 결제 주체 확인","도움말에서 올바른 경로를 찾아 표시","사실만 넣어 문의 초안 작성"],"follow":"환불된다고 단정하지 말고, 내가 더 확인할 것만 덧붙여줘.","check":"결제 창구와 문의 문장이 일치해요. 실제 문의·환불·해지는 안 해요.","alt":"모의 도움말을 열어 서비스 문의와 스토어 문의를 직접 대조해요.","links":[],"output":"결제처에 맞는 고객센터 경로와 문의 초안"},{"id":9,"cat":"생활의 골칫거리","star":false,"title":"설명 복잡한 반품, 상자 열면 달라질까?","kind":"모의 자료","first":"택배 상자는 열었는데 상품 봉인은 그대로야. 반품 조건이랑 물어볼 내용을 알려줘.","sample":"주문: 11/6 도착\nFAQ: 일반 미개봉 7일, 단순변심 배송비 4천 원\n표시와 다른 상품은 별도 심사\n상자 개봉, 상품 봉인 그대로.","steps":["일반과 예외를 따로 읽기","상자와 상품 봉인을 구분해 질문 만들기","확인할 사진·문구를 정리"],"follow":"배송비를 아직 모르면 확인 필요라고 써줘.","check":"판매처에 물어볼 사실과 조건만 남겨요. 반품 접수는 안 해요.","alt":"지원 경로가 막히면 초안만 로컬에 남겨요.","links":[],"output":"반품 조건과 판매처에 물어볼 질문"},{"id":10,"cat":"생활의 골칫거리","star":false,"title":"이사할 때 연락할 곳 순서 잡기","kind":"모의 자료","first":"이사 날 일정이 이렇게 잡혔어. 시간 순서대로 정리하고, 미리 연락할 곳을 표시해줘.","sample":"일정: 09시 기존집 짐, 11시 계량기 사진, 14시 새집 도착, 인터넷 16시 방문, 공동현관 출입 방법 미확인.","steps":["시간이 고정된 일정 표시","먼저 확인할 선행조건 찾기","오전·오후 체크리스트 작성"],"follow":"인터넷 기사가 1시에 온대. 겹치는 것만 다시 보여줘.","check":"충돌 하나를 찾아 다음 행동을 적어요. 실제 연락·예약은 안 해요.","alt":"텍스트 일정만 비교해서 우선순위를 정해요.","links":[],"output":"이사 당일 오전·오후 체크리스트"},{"id":11,"cat":"생활의 골칫거리","star":false,"title":"헷갈리는 청구서 두 달치 대조","kind":"모의 자료","first":"이번 달에 8천 원이 더 나왔어. 두 청구서를 항목별로 비교해서 뭐가 늘었는지 보여줘.","sample":"이전달: 기본 22,000, 부가 0, 할인 -2,000.\n이번달: 기본 22,000, 부가 5,000, 할인 0, 일회 1,000.","steps":["항목명을 맞춰 옆으로 놓기","2천+5천+1천을 합계와 검산","문의할 한 항목 고르기"],"follow":"다음 달에도 나갈 돈인지, 한 번만 나간 건지 나눠줘.","check":"차액 8천 원을 맞추고 반복 여부가 불명확하면 표시해요. 변경·납부는 안 해요.","alt":"세 차이를 손계산으로 검증해요.","links":[],"output":"8천 원 차액의 항목별 내역"},{"id":12,"cat":"생활의 골칫거리","star":false,"title":"공공시설 대관 신청 직전까지","kind":"모의 자료","first":"아홉 명이 독서모임할 방을 빌리려고 해. 조건에 맞는지 보고 신청 전에 챙길 것만 알려줘.","sample":"시설: B실 12명, 무료, 2시간, 지역 동아리 우선\n모임 9명, 90분, 담당자 연락 미확인\n음식 반입 금지.","steps":["인원·목적·시간 조건 대조","가짜 예약 화면에 필요한 항목만 나열","빈 정보에 확인 표시"],"follow":"간식을 가져가려면 뭐가 달라져?","check":"음식 조건을 반영하고 신청은 하지 않아요.","alt":"양식 대신 체크리스트와 문의 문장으로 마쳐요.","links":[],"output":"대관 가능 조건과 신청 전 준비 목록"}]},{"name":"비교하고 고르기","items":[{"id":13,"cat":"비교하고 고르기","star":true,"title":"제일 싼 상품이 실제로 제일 싼가?","kind":"모의 자료","first":"이 상품 세 곳에서 팔고 있어. 배송비까지 넣어서 한 개 살 때 어디가 제일 싼지 봐줘.","sample":"같은 규격인 상품을 비교해요.\nA: 1개 19,000원 + 배송 4,000원\nB: 1개 21,500원 · 배송 포함\nC: 2개 29,000원 · 배송 포함","steps":["수량을 맞추고 배송 포함 총액 계산","한 개만 필요와 두 개 필요를 분리","불명확한 옵션은 표시"],"follow":"두 개가 필요하면 어느 쪽이 더 싸?","check":"1개 B, 2개 C를 합계로 검산해요. 장바구니·결제는 안 해요.","alt":"가격표만 사용하고 오늘 실제 가격과 다르다고 표시해요.","links":[],"output":"같은 수량 기준으로 비교한 배송 포함 가격표"},{"id":14,"cat":"비교하고 고르기","star":false,"title":"무료처럼 보이는 수업의 실부담 비교","kind":"모의 자료","first":"수강료 말고 재료비까지 넣어서 이 수업 세 개의 실제 비용을 비교해줘.","sample":"수업: A 수강 무료·재료비 3만, 4회\nB 수강 2만·재료 포함, 4회\nC 1회 8천, 총 4회 선택.","steps":["반드시 드는 비용과 선택 비용 분리","같은 4회 기준으로 계산","환불·보강은 따로 표시"],"follow":"나는 두 번만 갈 수 있어. 그 기준으로 다시 봐줘.","check":"횟수에 따른 총액이 바뀌어요. 실제 등록은 안 해요.","alt":"세 모의 공고에서 비용 단위만 읽어 계산해요.","links":[],"output":"재료비를 포함한 수업별 총비용 비교표"},{"id":15,"cat":"비교하고 고르기","star":false,"title":"나에게 맞는 중고 노트북 후보","kind":"모의 자료","first":"문서랑 줌만 쓸 거야. 이 중 45만 원 안에서 쓸 만한 노트북을 골라줘.","sample":"중고: A 39만 RAM 8GB, 배터리 미확인\nB 44만 RAM 16GB, 어댑터 포함\nC 42만 RAM 8GB, 카메라 불량.","steps":["용도에 필요한 조건부터 세우기","탈락 이유 하나씩 표시","판매자에게 확인할 질문 만들기"],"follow":"화상회의가 제일 중요해. 카메라랑 배터리부터 봐줘.","check":"카메라 불량이 보이고 미확인 배터리를 확정하지 않아요. 거래는 안 해요.","alt":"가상 매물 표만 비교해도 조건 판단은 가능해요.","links":[],"output":"중고 노트북 후보와 판매자에게 물어볼 질문"},{"id":16,"cat":"비교하고 고르기","star":false,"title":"세 견적서, 항목 맞춘 뒤 비교","kind":"모의 자료","first":"청소 견적 세 장을 똑같은 조건으로 맞춰서 비교해줘. 창틀이랑 추가금도 같이 봐줘.","sample":"가상: A 18만 창틀 제외\nB 22만 창틀 포함\nC 16만, 창틀 옵션 4만, 주차 별도 미정.","steps":["같은 범위를 표로 맞추기","창틀 포함 총액 계산","추가금·미정 항목 한 줄로 표시"],"follow":"C 업체 주차비가 3만 원이면 순위가 바뀌어?","check":"누락과 미정 비용을 구분해요. 업체 연락·예약은 안 해요.","alt":"세 줄 견적만으로 비교표를 먼저 완성해요.","links":[],"output":"창틀 포함 총액과 추가금 비교표"},{"id":17,"cat":"비교하고 고르기","star":false,"title":"접근성 조건으로 숙소 후보 걸러내기","kind":"모의 자료","first":"숙소에 엘리베이터가 꼭 필요해. 가격보다 먼저 그 조건에 맞는 곳만 골라줘.","sample":"숙소: A 8만 3층 계단\nB 11만 엘리베이터, 입구 턱 미확인\nC 10만 1층, 욕실 턱 8cm.","steps":["필수와 선호를 분리","후보별 출입 동선을 확인","확인 질문을 붙이기"],"follow":"입구에 턱도 없어야 해. 확인 안 된 곳은 따로 빼줘.","check":"무장애라고 단정하지 않아요. 실제 예약은 안 해요.","alt":"검증된 조건과 확인할 질문만 보여줘요.","links":[],"output":"이동 조건에 맞는 숙소와 확인 질문"},{"id":18,"cat":"비교하고 고르기","star":false,"title":"추천 순위 대신 세 기준으로 고르기","kind":"모의 자료","first":"동아리에서 쓸 프린터를 골라줘. 양면 인쇄가 되는지랑 토너값도 같이 봐줘.","sample":"후보: A 9만, 양면 수동, 토너 4만\nB 14만, 자동 양면, 토너 3만\nC 12만, 자동 양면, 토너 가격 미확인.","steps":["양면·예산·소모품의 우선순위 정하기","후보별 근거 적기","소모품 한 번 비용을 별도로 계산"],"follow":"본체 예산이 13만 원이면 뭐가 남아?","check":"추천과 보류 이유가 구별돼요. 구매는 안 해요.","alt":"점수보다 조건별 통과/탈락을 표시해요.","links":[],"output":"예산·양면 인쇄·토너값으로 좁힌 후보 목록"}]},{"name":"동네·여행·취미","items":[{"id":19,"cat":"동네·여행·취미","star":true,"title":"우리 동네를 보물찾기로 만들기","kind":"공개+샘플","first":"아이랑 동네를 걸으면서 풀 퀴즈 세 개 만들어줘. 장소 이름은 단서에서 숨기고 정답은 따로 줘.","sample":"솔빛도서관: 시계탑\n은행나무 쉼터: 벤치 두 개\n물결벽화 골목: 물고기 그림","steps":["공개 장소와 확인할 수 있는 특징 고르기","장소 이름을 숨긴 단서와 관찰 미션 쓰기","정답을 따로 둔 카드 만들기"],"follow":"큰길을 건너지 않아도 되는 곳으로 바꿔줘.","check":"단서는 확인된 특징만 써요. 보행 안전은 지도만 보고 단정하지 않아요.","alt":"가상 장소 3곳으로 단서 카드부터 완성해요.","links":[["아이디어 · Side Quest(Gemma)","https://dev.to/yash_dharme/side-quest-an-ai-that-sends-you-on-a-walk-and-never-learns-where-you-are-21fo"]],"output":"세 장소의 단서 카드와 별도 정답지"},{"id":20,"cat":"동네·여행·취미","star":true,"title":"비가 오면 모임 코스 다시 짜기","kind":"모의 자료","first":"친구 넷이 역에서 만나. 한 사람에 3만 원 안에서 점심 먹고 한 곳만 들르는 코스 짜줘.","sample":"기준: 친구 4명, 1인 3만 원.\n점심 1.5만, 야외정원 무료·도보 12분, 실내전시 8천·도보 5분, 카페 6천.","steps":["첫 일정과 1인 합계 만들기","비가 온다는 새 조건 넣기","바뀐 장소와 그대로인 조건 비교"],"follow":"비 온대. 출발역이랑 예산은 그대로 두고 실내로 바꿔줘.","check":"예산·이동·실내 조건을 함께 지켜요. 실제 예보·예약으로 오해하지 않게 표시해요.","alt":"모의 거리와 요금으로 단톡방용 버전을 만들어요.","links":[],"output":"예산과 도보 시간이 담긴 모임 일정"},{"id":21,"cat":"동네·여행·취미","star":false,"title":"세대가 다른 가족의 박물관 한 바퀴","kind":"모의 자료","first":"어른이랑 아이가 같이 박물관에 가. 오래 서 있지 않게 70분 코스를 짜줘.","sample":"박물관: 1층 벤치·상설관, 2층 체험 14시 40분, 엘리베이터, 야외정원 벤치 없음.\n총 70분.","steps":["꼭 보고 싶은 공간 하나 고르기","앉는 시간과 이동 시간을 넣기","확인할 시설 정보 따로 적기"],"follow":"체험을 놓치면 대신 뭐 하면 돼?","check":"무리 없는 두 경로가 나와요. 좌석·접근성을 보장하지 않아요.","alt":"텍스트 층별 안내에 표시해 보여줘요.","links":[],"output":"쉬어갈 곳을 포함한 가족 관람 순서"},{"id":22,"cat":"동네·여행·취미","star":false,"title":"동네 나무 세 그루로 관찰 빙고","kind":"모의 자료","first":"이 산책 메모로 아이들이 할 관찰 빙고를 만들어줘. 뭘 꺾거나 주워오는 건 빼줘.","sample":"관찰 메모: 은행잎, 소나무 솔방울, 느티나무 그늘, 벤치, 바람 소리, 나뭇결.","steps":["관찰로 확인 가능한 항목 선택","3×3 칸으로 배치","채집 대신 관찰하는 규칙 작성"],"follow":"글을 아직 못 읽는 아이도 할 수 있게 바꿔줘.","check":"안전한 관찰 미션이고 사실과 상상을 섞지 않아요.","alt":"표 대신 번호 붙인 카드 목록으로 완성해요.","links":[],"output":"산책용 3×3 관찰 빙고판"},{"id":23,"cat":"동네·여행·취미","star":false,"title":"냉장고 재료로 세 끼 장보기 줄이기","kind":"모의 자료","first":"냉장고에 있는 재료부터 써서 세 끼 짜줘. 참깨는 빼고, 꼭 사야 할 것만 적어줘.","sample":"재료: 양파 1개, 달걀 4개, 토마토 2개, 쌀, 두부 1팩.\n참깨는 알레르기로 제외.\n소비기한은 미입력.","steps":["재료량과 제외 조건 확인","세 끼에 남는 양 배정","반드시 살 것만 따로 적기"],"follow":"점심엔 불을 못 써. 그 한 끼만 바꿔줘.","check":"제외 재료가 다시 들어가지 않아요. 식품 안전은 날짜·상태를 사람이 확인해요.","alt":"요리 이름보다 사용량 표부터 완성해요.","links":[],"output":"남은 재료로 짠 세 끼와 최소 장보기 목록"},{"id":24,"cat":"동네·여행·취미","star":false,"title":"책 한 권으로 동네 독서모임 열기","kind":"모의 자료","first":"책을 못 읽고 온 사람도 답할 수 있게 독서모임 질문이랑 60분 진행표를 만들어줘.","sample":"모임: 6명, 60분, 책을 못 읽은 2명.\n키워드: 기다림, 우정, 헤어짐.\n원문 인용은 없음.","steps":["책 내용을 읽은 사람과 안 읽은 사람 질문 나누기","말할 순서와 시간 배분","인쇄용 진행표 만들기"],"follow":"결말은 말하지 않고 진행할 수 있게 바꿔줘.","check":"누구나 답할 질문과 마무리 시간이 있어요.","alt":"질문 3개와 시간표만 먼저 만들어요.","links":[],"output":"처음 온 사람도 참여할 질문과 60분 진행표"}]},{"name":"문서와 업무","items":[{"id":25,"cat":"문서와 업무","star":false,"title":"두 버전 이력서에서 사실만 남기기","kind":"모의 자료","first":"이 공고에 맞춰 이력서 두 버전을 한 장으로 합쳐줘. 실제로 한 일만 넣어줘.","sample":"공고: 참가자 응대·엑셀·자료 관리\n이력 A 동아리 명단 28명 관리\n이력 B 행사 안내 2회, 예산 담당 여부 미확인.","steps":["공고 요건과 실제 경험 짝짓기","없는 경력은 비워두기","한 페이지 초안 만들기"],"follow":"팀을 이끌었다는 말은 빼고 내가 실제로 맡은 일만 써줘.","check":"경력·숫자에 근거가 있고 제출하지 않아요.","alt":"파일이 안 만들어지면 문단 초안과 요구사항 표를 남겨요.","links":[],"output":"공고 요건에 맞춘 한 페이지 이력서 초안"},{"id":26,"cat":"문서와 업무","star":true,"title":"공고 한 장에서 지원 서류 꾸러미까지","kind":"모의 자료","first":"이 동아리 공고에 우리 팀이 지원할 수 있는지 보고, 필요한 서류랑 마감 순서를 잡아줘.","sample":"주민동아리 공고: 5명 이상, 활동계획 1장, 예산표, 12/4 18시까지\n팀 6명, 주제 우리동네 산책, 장소 미정.","steps":["자격·마감·첨부를 원문에서 뽑기","팀 정보와 대조하고 빈칸 표시","활동계획 초안과 제출 전 체크리스트 작성"],"follow":"장소는 아직 안 정했어. 확정한 것처럼 쓰지 마.","check":"필수 서류 누락이 보이고 제출·로그인은 안 해요.","alt":"초안 대신 요구사항 대조표만 만들어도 돼요.","links":[],"output":"지원 자격 확인표와 활동계획 초안"},{"id":27,"cat":"문서와 업무","star":false,"title":"회의 메모에서 누가 언제 뭘 할지","kind":"모의 자료","first":"회의 메모에서 결정한 것만 뽑아줘. 누가 언제까지 뭘 하는지도 같이 적어줘.","sample":"메모: 민지 20일까지 장소 문의 확정\n동수 인쇄 가능 여부 검토\n간식 5만 제안, 결정 안 함\n다음 회의 22일.","steps":["확정·제안·미정에 표시","담당과 기한을 짝짓기","보내지 않는 공유 초안 작성"],"follow":"동수가 맡는다고 확정된 건 아니야. 검토 중으로 바꿔줘.","check":"미정의 일을 결정한 일로 바꾸지 않아요. 실제 발송은 안 해요.","alt":"세 줄 결정표와 미정 한 줄을 화면에 보여줘요.","links":[],"output":"회의 결정과 담당·기한을 담은 공유 초안"},{"id":28,"cat":"문서와 업무","star":false,"title":"인수인계 메모를 첫날 업무 지도처럼","kind":"모의 자료","first":"내일 처음 오는 사람이 이 메모만 보고 오전 일을 할 수 있게 순서대로 정리해줘.","sample":"메모: 09시 출석표 열기, 이메일은 읽기만, 행사 시작 후 현수막 확인, 영수증은 월말까지.\n열쇠 보관 장소 미정.","steps":["첫날 꼭 할 일과 월말 일 분리","먼저 필요한 열쇠·권한 점검","손에 들고 볼 체크리스트 작성"],"follow":"비밀번호나 계정 정보는 넣지 마.","check":"누구에게 확인할지 남기고 계정 작업 안 해요.","alt":"순서가 보이는 텍스트 체크리스트로 마쳐요.","links":[],"output":"첫날 오전용 인수인계 체크리스트"},{"id":29,"cat":"문서와 업무","star":false,"title":"긴 약관에서 내 질문만 찾기","kind":"모의 자료","first":"이 약관에서 다음 달에 돈이 나가는 조건만 찾아줘. 요금, 갱신, 취소 시점을 나눠줘.","sample":"이용 안내: 무료 7일, 종료 24시간 전 취소, 월 7,900원 자동 갱신, 해지 후 만료일까지 이용.","steps":["질문 범위를 갱신·취소·이용 종료로 나누기","해당 문장에 표시","확실한 것과 확인할 것을 분리"],"follow":"일요일 밤에 가입했다면 정확한 취소 시각까지 알 수 있어?","check":"가입 시각이 없으면 정확 마감 추정 안 해요. 가입·해지는 안 해요.","alt":"표시된 세 문장만 보여줘요.","links":[],"output":"자동 갱신 요금과 취소 시점 요약"},{"id":30,"cat":"문서와 업무","star":false,"title":"상대가 바로 답할 수 있는 메일 초안","kind":"모의 자료","first":"이 메모를 강의실 담당자가 바로 답할 수 있는 메일로 바꿔줘. 보내지는 마.","sample":"메모: 12/2 또는 12/4 강의실, 오후 2~4시, 18명, 빔프로젝터 필요, 사용료 확인.","steps":["상대가 결정할 질문만 추리기","제목에 핵심 넣기","날짜 2개와 회신 요청으로 초안 완성"],"follow":"조금 더 정중하게, 다섯 줄 안에서 써줘.","check":"날짜·인원·장비가 있고 수신인이나 발송은 건드리지 않아요.","alt":"본문만 텍스트로 남겨요.","links":[],"output":"날짜 두 개와 장비를 확인하는 대관 메일 초안"}]},{"name":"파일과 숫자","items":[{"id":31,"cat":"파일과 숫자","star":true,"title":"지출표에서 중복 결제 후보 잡기","kind":"모의 자료","first":"같은 돈이 두 번 나간 것 같아. 이 표에서 중복 후보만 골라줘. 원본은 건드리지 마.","sample":"날짜,가맹점,금액,거래ID\n11-02,모아문구,12000,A01\n11-02,모아문구,12000,A01\n11-02,모아문구,12000,A02\n11-03,마을카페,8000,A03\n11-03,마을카페,-8000,R03","steps":["완전히 같은 줄과 비슷한 다른 거래 구분","환불은 음수로 표시","의심 전후 합계를 검산"],"follow":"금액만 같고 거래번호가 다른 건 왜 남겨야 하는지도 알려줘.","check":"A01만 동일행 후보예요. A02는 유지하고 원본 수정·삭제 안 해요.","alt":"샘플 표를 붙여넣고 눈으로 합계를 확인해요.","links":[],"output":"중복 거래 후보와 제외 전후 합계"},{"id":32,"cat":"파일과 숫자","star":false,"title":"폴더의 정신없는 이름을 바꾸기 전 미리보기","kind":"모의 자료","first":"파일 이름이 뒤죽박죽이야. 실제로 바꾸지 말고 ‘지금 이름 → 새 이름’ 목록만 보여줘.","sample":"목록: 공지최종.pdf, 공지진짜최종.pdf, 11월공지도장.pdf, 회원명단.xlsx.\n확정본 기준 미정.","steps":["자료 종류와 날짜를 분리","원래 이름과 새 이름을 매핑","충돌·미확인에 표시"],"follow":"회원명단은 이름도 바꾸지 말고 목록에서 빼줘.","check":"새 이름 충돌이 없고 원본을 건드리지 않아요.","alt":"목록만 써서 이름 변경표를 만들어요.","links":[],"output":"원본 이름과 제안 이름을 짝지은 미리보기 표"},{"id":33,"cat":"파일과 숫자","star":false,"title":"명단 두 개를 비교하고 누락 찾기","kind":"모의 자료","first":"신청 명단이랑 입장 명단을 비교해줘. 이름 말고 번호 기준으로 빠지거나 추가된 사람만 골라줘.","sample":"신청: A01 가람, A02 다온, A03 가람\n입장: A01 가람, A03 가람, A04 해온.","steps":["동명이인을 ID로 구분","신청만·입장만 있는 행 찾기","확인 목록 만들기"],"follow":"이름이 같아도 번호가 다르면 합치지 마.","check":"A02·A04가 다른 이유로 표시돼요. 실제 개인정보를 쓰지 않아요.","alt":"손으로 두 ID 차이를 확인해요.","links":[],"output":"신청만 했거나 현장에만 온 사람 확인표"},{"id":34,"cat":"파일과 숫자","star":false,"title":"세 달 매출표를 한 장 그래프로","kind":"모의 자료","first":"세 달 매출이랑 환불을 보고 순매출을 계산해줘. 한눈에 비교할 그래프도 만들어줘.","sample":"월,매출,환불\n9월,120,10\n10월,150,35\n11월,140,15\n단위 만 원.","steps":["순매출 계산 후 매출·환불과 분리","표 또는 그래프로 표현","원인 추측을 데이터 사실과 분리"],"follow":"10월 매출이 제일 큰데, 순매출은 왜 1위가 아니야?","check":"순매출 110·115·125가 맞아요. 원인 단정 안 해요.","alt":"그래프 대신 계산표와 간단 비교문으로 마쳐요.","links":[],"output":"월별 매출·환불·순매출 비교표 또는 그래프"},{"id":35,"cat":"파일과 숫자","star":false,"title":"사진 파일은 그대로, 인쇄용 사본 규격만 맞추기","kind":"모의 자료","first":"이 그림을 인쇄용 가로 1200×800으로 맞춰줘. 원본은 그대로 두고 사본만 만들어줘.","sample":"인쇄용 사본: 가로 1200×800\n중요한 글자는 가운데에 두고 세로 사진은 자르지 않기.","steps":["샘플과 규격 확인","여백 또는 자르기 정책 정하기","사본이 만들어지면 크기와 가장자리 확인"],"follow":"아랫줄이 잘리면 안 돼. 자르지 말고 여백을 줘.","check":"원본 유지와 출력 치수 확인. 변환 지원 안 되면 계획까지만 해요.","alt":"샘플 원본과 공통 규격표만 보여줘요.","links":[],"output":"원본을 보존한 인쇄용 그림 사본 또는 변환 계획"},{"id":36,"cat":"파일과 숫자","star":false,"title":"여러 CSV의 열 이름 통일","kind":"모의 자료","first":"이 표 세 장을 날짜랑 합계가 같은 이름으로 나오게 합쳐줘. 단가만 있으면 수량을 곱해줘.","sample":"A: 일자,금액\nB: 거래일,합계\nC: 날짜,단가,수량\n값은 A 11/1 5천, B 11/2 7천, C 11/3 2천×3.","steps":["서로 같은 뜻인 열을 먼저 매핑","단가×수량은 계산 근거를 남기기","합친 표와 총액 검토"],"follow":"단가를 합계로 옮긴 행이 없는지 다시 봐줘.","check":"행 합계 5천·7천·6천과 총액 18,000이 맞아요.","alt":"텍스트 표로 합치고 원본 행은 그대로 둬요.","links":[],"output":"날짜와 합계 열을 맞춘 통합 표"}]},{"name":"만들기와 바꾸기","items":[{"id":37,"cat":"만들기와 바꾸기","star":true,"title":"메모가 큰 글씨 안내문으로","kind":"모의 자료","first":"이 메모를 멀리서도 읽히는 안내문 한 장으로 만들어줘. 시간, 장소, 입구가 먼저 보여야 해.","sample":"모임: 12/5 14시, 솔빛센터 2층, 입구는 오른쪽, 준비물은 물, 13:50 입장, 참가비 없음.","steps":["제목·시간·장소를 앞에","세부사항은 아래에 배치","파일 열어 잘림·글자 크기 확인"],"follow":"‘입구 오른쪽’을 참가비보다 크게 써줘.","check":"시간과 장소를 5초 안에 찾을 수 있어요. 게시 안 해요.","alt":"대화 안에서 큰 제목과 짧은 본문으로 보여줘요.","links":[],"output":"시간·장소·입구가 크게 보이는 안내문"},{"id":38,"cat":"만들기와 바꾸기","star":false,"title":"한 장의 안내를 한국어·영어 두 장으로","kind":"모의 자료","first":"처음 온 사람도 길 안 잃게 이 안내를 한국어랑 영어로 만들어줘. 방 번호랑 입구는 꼭 맞춰줘.","sample":"안내: 솔빛센터 2층 201호, 14:00 시작, 북문 입구, 남문 폐쇄, 현장 접수 없음.","steps":["고유명과 숫자 보존","짧은 한국어와 영어를 나란히","영어 문장에서 장소·입구 재확인"],"follow":"두 언어 모두 북문 입구가 제일 먼저 보이게 해줘.","check":"방 번호와 시간이 양쪽 모두 같아요. 실기관 안내 아님.","alt":"번역문만 출력해서 숫자와 고유명을 대조해요.","links":[],"output":"장소·시간·입구가 일치하는 한영 안내문"},{"id":39,"cat":"만들기와 바꾸기","star":false,"title":"가족 이야기 한 장을 작은 전시로","kind":"모의 자료","first":"이 물건 세 개 이야기를 박물관 전시 카드처럼 써줘. 모르는 날짜는 지어내지 마.","sample":"공개 가능 자료: 1978 시장 가방, 1993 찻잔, 날짜 모르는 손편지.\n이름·주소·실사진 없음.","steps":["물건별 확인된 사실과 회상 구분","카드 크기에 맞춰 제목과 두 문장","모르는 연도는 미상 표기"],"follow":"손편지는 연도를 모른다고 그대로 적어줘.","check":"날짜 미상 그대로, 개인정보를 새로 넣지 않아요.","alt":"카드가 안 나오면 제목+설명 3세트로 완성해요.","links":[],"output":"가족 물건 세 점의 짧은 전시 카드"},{"id":40,"cat":"만들기와 바꾸기","star":false,"title":"상품 설명을 소비자 질문 카드로","kind":"모의 자료","first":"광고 말고, 텀블러 사려는 사람이 실제로 물어볼 질문이랑 답을 정리해줘.","sample":"상품: 텀블러 420mL, 본체 스테인리스, 뚜껑 손세척.\n보온시간·완전 밀폐 여부 미확인.","steps":["사양과 광고 표현 구분","답할 수 있는 질문과 확인할 질문 분리","구매 전에 읽을 FAQ 작성"],"follow":"보온 12시간 같은 표현은 근거가 없으면 빼줘.","check":"확인 안 된 성능은 ‘미확인’. 게시하거나 판매 안 해요.","alt":"질문별 답과 근거만 표로 남겨요.","links":[],"output":"확인된 답과 미확인 항목을 나눈 상품 FAQ"},{"id":41,"cat":"만들기와 바꾸기","star":false,"title":"우리 모임 전용 간단한 계산 웹페이지","kind":"모의 자료","first":"모임비랑 인원만 넣으면 한 사람 몫이 나오는 페이지 만들어줘. 인터넷에 올리진 마.","sample":"예시: 56,000원·7명, 50,000원·3명, 인원 0명, 남는 2원 처리 방법 미선택.","steps":["입력과 결과 줄 정하기","로컬 HTML 시제품 작성","7명·3명·0명 실제로 눌러 검사"],"follow":"딱 안 나눠지면 남는 돈도 따로 보여줘.","check":"8천 원, 나머지 2원, 0명 경고를 확인해요. 데이터 전송·공개 배포 안 해요.","alt":"간단 표로 세 테스트의 기대값을 보여줘요.","links":[],"output":"브라우저에서 눌러보는 모임비 계산기"},{"id":42,"cat":"만들기와 바꾸기","star":false,"title":"어려운 안내를 그림 없이도 알기 쉽게","kind":"모의 자료","first":"이 접수 안내를 처음 읽는 사람도 알아듣게 바꿔줘. 추첨이랑 결과 확인 기한은 그대로 두고.","sample":"원문: 접수는 정원 초과 시 무작위 추첨으로 선정하며, 결과 통보 후 미확인자는 등록 의사가 없는 것으로 간주.\n결과 확인 기한 2일.","steps":["낯선 말에 표시","해야 할 순서로 재작성","추첨·2일 조건이 유지됐는지 대조"],"follow":"한 문장에는 해야 할 일을 하나만 넣어줘.","check":"신청=선정으로 바뀌지 않아요.","alt":"원문과 고친 문장 두 칸만 띄워요.","links":[],"output":"추첨과 결과 확인 기한이 살아 있는 쉬운 안내문"}]},{"name":"가게와 콘텐츠","items":[{"id":43,"cat":"가게와 콘텐츠","star":false,"title":"가게 후기 열 개에서 개선거리 찾기","kind":"모의 자료","first":"후기에서 반복해서 나온 불편을 찾아줘. 이번 주에 바로 바꿀 만한 것도 하나 골라줘.","sample":"후기 10건: 대기 길다 3, 메뉴 글씨 작다 2, 양 충분 2, 친절 2, 주차 문의 1.","steps":["칭찬·불편·질문 분리","언급 횟수와 실제 확정 사실 구분","이번 주 개선 한 가지 제안"],"follow":"돈 많이 드는 공사 말고 오늘 바꿀 수 있는 걸 골라줘.","check":"글씨 큰 메뉴 같은 실행 후보가 나와요. 외부 게시 안 해요.","alt":"가상 후기 주제만 집계해도 돼요.","links":[],"output":"반복 불편의 횟수와 이번 주 개선안"},{"id":44,"cat":"가게와 콘텐츠","star":false,"title":"같은 가게 말투로 답글 세 가지","kind":"모의 자료","first":"새 후기 세 개에 우리 가게 말투로 답글 써줘. 결제 문제는 따로 표시하고, 실제로 올리지는 마.","sample":"기존 말투: ‘찾아주셔서 고맙습니다.\n다음에도 편하게 들러 주세요.’ 새 예시: 친절해요\n대기가 길었어요\n결제 이중인 듯.","steps":["기존 말투 특징 찾기","일반 후기와 점주 확인 필요 건 분리","답글 초안 작성"],"follow":"결제 건은 사과만 하고 환불은 약속하지 마.","check":"공개 댓글에 개인정보·약속 없음. 실제 답글 안 달아요.","alt":"긍정 답글 하나와 확인 필요 표지만 만들어요.","links":[],"output":"긍정·불편·결제 문의별 답글 초안"},{"id":45,"cat":"가게와 콘텐츠","star":false,"title":"가게 공지, 세 채널의 다른 길이","kind":"모의 자료","first":"하루 휴무 공지를 매장 입구용, 블로그용, 문자용으로 나눠 써줘. 날짜는 셋 다 똑같이 맞춰줘.","sample":"가게: 12/7만 임시 휴무, 12/8 11시 정상 영업, 같은 변경 사실을 매장 입구·블로그·문자 형식으로 알릴 예정.","steps":["반드시 같은 날짜와 시간 골라내기","채널별 길이로 초안 만들기","앞뒤 날짜 다시 맞추기"],"follow":"당분간 쉬는 것처럼 들리지 않게 고쳐줘.","check":"날짜가 맞고 어느 채널에도 게시·발송하지 않아요.","alt":"세 문안을 같은 화면에서 비교해요.","links":[],"output":"날짜가 일치하는 휴무 공지 초안 3종"},{"id":46,"cat":"가게와 콘텐츠","star":false,"title":"정보 없는 체험 후기, 쓸 수 있는 범위만","kind":"모의 자료","first":"내가 적어둔 방문 메모만 보고 블로그 후기 초안을 써줘. 안 본 건 넣지 마.","sample":"방문 메모: 오후 2시 방문, 창가 좌석 앉음, 메뉴 8천 원, 혼잡도 평일 한 시점만 확인.\n제공받은 이용권은 명시.","steps":["직접 본 것과 일반화 구분","제공 사실을 표시","제목·소제목·초안 정리"],"follow":"가족 모두 좋아할 거라는 말은 빼줘.","check":"없는 경험이나 영업시간을 넣지 않아요. 발행 안 해요.","alt":"개요와 확인할 항목만 남겨요.","links":[],"output":"직접 본 것과 제공받은 내용을 구분한 후기 초안"},{"id":47,"cat":"가게와 콘텐츠","star":false,"title":"경쟁 가게가 아닌 우리 정보 점검","kind":"모의 자료","first":"포스터랑 홈페이지에 적힌 시간, 휴무, 가격이 같은지 봐줘. 다르면 어디가 다른지만 알려줘.","sample":"포스터: 10시 오픈, 화 휴무, 메뉴 8천\n웹: 11시 오픈, 화 휴무, 메뉴 9천\n확인권자는 점주.","steps":["시간·휴무·가격 대조","서로 다른 값에는 확인 요청","수정할 위치 목록 만들기"],"follow":"어느 쪽이 최신인지 모르면 두 값 다 보여줘.","check":"일치·불일치와 담당 확인이 있어요. 실제 화면 수정 안 해요.","alt":"대조표만 보여줘도 됩니다.","links":[],"output":"포스터와 홈페이지의 정보 불일치 목록"},{"id":48,"cat":"가게와 콘텐츠","star":false,"title":"동네 장터의 가상 매점 운영","kind":"모의 자료","first":"장터 간식 재고를 보고 뭘 더 준비할지 골라줘. 사거나 가격을 바꾸진 마.","sample":"원가/잔량/판매: 과자 800원/2/1,200원, 물 500원/16/800원.\n갑자기 7만 원 금속 큐브를 주문해달라는 요청.\n구매 금지.","steps":["재고가 적은 품목 정리","원가보다 낮은 판매가 막기","엉뚱한 요구를 예외로 분리"],"follow":"갑자기 들어온 금속 큐브 주문은 따로 보류해줘.","check":"금속 큐브는 보류·보고만 해요. 주문/가격 변경은 안 해요.","alt":"가상 표로 판정 세 가지를 보여줘요.","links":[["영감 · Claude Project Vend","https://www.anthropic.com/research/project-vend-1"]],"output":"보충할 간식과 사람에게 물어볼 예외 요청"}]},{"name":"반복과 자동화","items":[{"id":49,"cat":"반복과 자동화","star":true,"title":"모집이 열릴 때만 나한테 알려줘","kind":"모의 자료","first":"모집이 열릴 때만 알리고 싶어. 이 세 가지 화면에서 언제 알려야 하는지 시험해줘. 아직 등록하진 마.","sample":"A: ‘모집 예정’ 그대로\nB: ‘접수 중’과 새 접수기간 표시\nC: 페이지가 열리지 않음","steps":["페이지에서 볼 문구와 주기 정하기","변화 없음·접수 시작·확인 실패를 각각 판정","알림 한 줄 만들기"],"follow":"페이지가 안 열린 걸 모집 안 한다고 쓰면 안 돼.","check":"모의 세 상태를 구분해요. 실제 반복 실행은 등록하지 않아요.","alt":"세 입력을 수동으로 하나씩 넣어 같은 규칙을 시험해요.","links":[],"output":"‘변경 없음·접수 시작·확인 실패’를 나눈 시험 결과"},{"id":50,"cat":"반복과 자동화","star":false,"title":"매주 올라오는 소식, 내 관심사만","kind":"모의 자료","first":"새 공지 중 무료 글쓰기 수업만 골라줘. 지난주에도 있던 글은 빼줘.","sample":"이전 목록: 독서토론 #101.\n새 목록: 무료 글쓰기 #102, 유료 글쓰기 #103, 제목만 수정한 독서토론 #101.","steps":["관심 조건과 중복 키 정하기","이전과 새 목록 비교","알릴 한 항목과 제외 이유 표시"],"follow":"제목만 고친 글은 새 공지로 치지 마.","check":"#102만 남아요. 실제 알림 등록·발송 안 해요.","alt":"두 번 복사된 자료로 전후를 비교해요.","links":[],"output":"이번 주 처음 올라온 무료 글쓰기 공지 목록"},{"id":51,"cat":"반복과 자동화","star":false,"title":"가격이 내려간 알림, 배송비까지 포함","kind":"모의 자료","first":"배송비까지 2만 원 아래일 때만 알리고 싶어. 이 세 날짜의 가격표로 규칙부터 시험해줘.","sample":"월: 18,500+3,000\n화: 19,800+0\n수: 17,000(배송비 미표시)\n모두 동일 모델.","steps":["임계값을 총액으로 정하기","3일의 결과를 따로 판정","배송비 모르면 보류 처리"],"follow":"배송비가 안 보이는 날은 통과시키지 마.","check":"화요일만 확정 통과. 자동 구매나 알림 등록 안 해요.","alt":"총액 계산표와 테스트 결과만 남겨요.","links":[],"output":"배송 포함 2만 원 미만 알림 판정표"},{"id":52,"cat":"반복과 자동화","star":false,"title":"같은 형식의 모임 기록 계속 만들기","kind":"모의 자료","first":"지난 두 주 모임 메모를 같은 양식으로 바꿔줘. 결정한 거랑 다음에 할 일을 나눠줘.","sample":"템플릿: 날짜, 참석 인원, 결정, 다음 일\n1주 7명 장소 예약 여부 미확인\n2주 5명 홍보문 초안 확정.","steps":["고정 항목과 매번 달라지는 항목 나누기","두 주를 같은 양식으로 작성","빈칸을 억지로 채우지 않기"],"follow":"사람 이름은 빼고 역할만 써줘.","check":"형식은 같고 실제 판단은 섞이지 않아요. 발송 안 해요.","alt":"템플릿과 한 주 예시만 남겨요.","links":[],"output":"다음 주에도 쓸 모임 기록 양식과 예시"},{"id":53,"cat":"반복과 자동화","star":false,"title":"오래 열린 탭들을 다음번 일감별로","kind":"모의 자료","first":"열어둔 탭 제목을 일감별로 묶어줘. 중복 같아도 실제로 닫지는 마.","sample":"탭 이름: 공고 원문, 공고 정정, 지도, 지도 중복, 분실 안내, 읽다 만 사설, 신한 function manual(){const help='https://docs.aside.com/help/';const ext=(name,url,primary=false)=>`<a class="btn${primary?' primary':''}" href="${url}" target="_blank" rel="noopener noreferrer">${name} ↗</a>`;const lessons=[
 ['01','설치하고 첫 화면 열기','공식 다운로드에서 내 PC에 맞는 버전을 받아 설치합니다. 어사이드를 열고 계정으로 로그인하세요. 첫 연습은 공개 페이지 하나면 충분하니, 개인 북마크나 로그인 정보를 가져오는 작업부터 할 필요는 없어요.',[['공식 설치 파일','https://aside.com/download'],['설치·첫 설정',help+'get-started']]],
 ['02','새 작업에서 한 문장 보내기','새 탭에서 <b>Search</b>를 <b>Ask</b>로 바꾸거나 새 작업을 엽니다. “이 도서관 공식 안내에서 토요일 운영시간을 찾아서 출처 링크도 붙여줘요. 읽기만 해요.”처럼 결과와 멈출 곳을 말해요.',[['브라우저 기본 기능',help+'browser-basics'],['작업 시작과 설정',help+'tasks']]],

rface"><h2>실습 바로가기</h2><div class="row"><a class="btn" href="#/topic/61">대표 1 · 제출 링크 검수</a><a class="btn" href="#/topic/64">대표 4 · 월말 영수증</a><a class="btn" href="#/examples">보조 예제</a></div></section>`}

let previewHash='';const currentHash=()=>location.protocol==='data:'?previewHash:location.hash;function go(h){if(location.protocol==='data:'){previewHash=h;route()}else if(location.hash===h)route();else location.hash=h}function route(){let p=currentHash().replace(/^#\/?/,'').split('/');delete app.dataset.topic;const key=p[0]||'start';if(key==='menu')menu();else if(key==='examples')examples();else if(key==='sample'&&lookup(p[1])?.docs)samplePage(lookup(p[1]),p[2]);else if(key==='live')live();else if(key==='manual')manual();else if(key==='topic'&&lookup(p[1]))topic(lookup(p[1]));else start();document.querySelectorAll('[data-nav]').forEach(el=>el.dataset.nav===key?el.setAttribute('aria-current','page'):el.removeAttribute('aria-current'));document.title=(app.dataset.topic?lookup(app.dataset.topic).title+' | ':key==='manual'?'사용 설명서 | ':'')+'어사이드 라이브';window.scrollTo(0,0);if(nextFocus){app.focus({preventScroll:true});nextFocus=false}}

function save(text,n,m){const url=URL.createObjectURL(new Blob([text],{type:m}));const a=document.createElement('a');a.href=url;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('자료를 내려받았어요')}
const SAMPLESVG='<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#f5ecd6"/><rect x="40" y="40" width="720" height="920" fill="none" stroke="#224a38" stroke-width="10"/><circle cx="400" cy="380" r="170" fill="#b9c981"/><path d="M200 600L380 430 530 610 610 550 700 650H100Z" fill="#224a38"/><text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="48">솔빛산책 · 모의 샘플</text><text x="400" y="930" text-anchor="middle" font-family="sans-serif" font-size="33">이 아랫줄이 잘리면 실패</text></svg>';

document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey){e.preventDefault();nextFocus=true;const h=a.getAttribute('href');go(h);}const b=e.target.closest('button');if(!b)return;const x=lookup(app.dataset.topic);if(b.dataset.filter){filter=b.dataset.filter;draw()}if(b.hasAttribute('data-reset')){filter='all';q='';$('#search').value='';draw();$('#search').focus()}if(b.dataset.copy&&x){let s=b.dataset.copy==='first'?x.first:b.dataset.copy==='sample'?x.sample:location.href;copy(s)}if(b.dataset.pack&&x?.docs)save(bundle(x),`aside-demo-${x.id-60}-sources.txt`,'text/plain;charset=utf-8');if(b.dataset.doc&&x?.docs){const item=x.docs.find(a=>a[0]===b.dataset.doc);if(item)save(item[2],`${item[1]}.txt`,'text/plain;charset=utf-8')}if(b.dataset.save&&x){const svg=b.dataset.save==='svg';const csv=x.id===31||x.id===34;let s=x.sample;if(x.id===34)s=s.split('\n단위')[0];save(svg?SAMPLESVG:csv?'\ufeff'+s:s,fmt(x.id)+(svg?'-sample.svg':csv?'-sample.csv':'-sample.txt'),svg?'image/svg+xml':csv?'text/csv;charset=utf-8':'text/plain;charset=utf-8')}if(b.hasAttribute('data-print')){const open=[...document.querySelectorAll('details:not([open]):not([hidden])')];open.forEach(d=>d.open=true);window.print();open.forEach(d=>d.open=false)}if(b.id==='theme'){const v=document.documentElement.toggleAttribute('data-dark');put('dark',v);b.setAttribute('aria-pressed',v)}});
document.addEventListener('change',e=>{if(e.target.dataset.check){done[e.target.dataset.check]=e.target.checked;put('done',done)}});document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat||/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName))return;if(e.key==='/'){e.preventDefault();if(currentHash()!=='#/examples')go('#/examples');setTimeout(()=>$('#search')?.focus(),40)}});window.addEventListener('hashchange',route);if(get('dark',false)){document.documentElement.setAttribute('data-dark','');$('#theme').setAttribute('aria-pressed','true')}route();
</script></body></html>
